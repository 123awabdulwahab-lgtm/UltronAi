name: Build Ultron AI APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Merge all steps into one project
        run: |
          unzip -o UltronAI-Step1.zip -d .
          unzip -o UltronAI-Step2.zip -d .
          unzip -o UltronAI-Step3.zip -d .
          unzip -o UltronAI-Step4.zip -d .
          unzip -o UltronAI-Step5-Final.zip -d .
          unzip -o UltronAI-Step6.zip -d .

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build signed release APK
        run: gradle assembleRelease --no-daemon
        working-directory: UltronAI

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: UltronAI-release-apk
          path: UltronAI/app/build/outputs/apk/release/app-release.apk
